[project]
name = "monaco"
version = "0.1.0"
description = "Data analysis of real estate: property prices, rentals, demographics and related topics."
readme = "README.md"
authors = [
    { name = "Tomas Prinda", email = "tomas.prinda@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "pyarrow>=26.0.0",
    "seaborn>=0.13.2",
]

[project.scripts]
monaco = "monaco:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# Never fall back to system / conda Python; always use uv-managed interpreters.
python-preference = "only-managed"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
